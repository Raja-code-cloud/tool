name: Backend Security Scan

on:
  pull_request:
    paths:
      - backend/**
      - docker/**
      - .github/workflows/security-scan.yml
  push:
    branches:
      - main
    paths:
      - backend/**
      - docker/**
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  PYTHON_VERSION: "3.13"

jobs:
  dependency-scan:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install package
        run: python -m pip install --upgrade pip pip-audit && pip install .

      - name: Run pip-audit
        run: pip-audit --strict

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container-scan:
    name: Container image scan and SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build API image for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: runtime
          load: true
          tags: cloud-content-hub-api:scan
          push: false

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: cloud-content-hub-api:scan
          artifact-name: sbom-api-scan.spdx.json

      - name: Scan API image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: cloud-content-hub-api:scan
          format: sarif
          output: trivy-api.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-api.sarif
          category: backend-container

  image-signing-hook:
    name: Image signing hook (release tags)
    if: startsWith(github.ref, 'refs/tags/backend-v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign images (hook)
        env:
          REGISTRY: ${{ vars.ACR_LOGIN_SERVER }}
          TAG: ${GITHUB_REF_NAME#backend-v}
        run: |
          echo "Signing hook ready for:"
          echo "${REGISTRY}/cloud-content-hub-api:${TAG}"
          echo "${REGISTRY}/cloud-content-hub-worker:${TAG}"
          echo "Configure AZURE_KEY_VAULT_KEY or COSIGN key material in repository secrets to enable signing."
