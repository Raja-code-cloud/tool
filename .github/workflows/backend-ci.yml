name: Backend CI

on:
  pull_request:
    paths:
      - backend/**
      - docker/**
      - .github/workflows/backend-ci.yml
      - .github/workflows/security-scan.yml
  push:
    branches:
      - main
    paths:
      - backend/**
      - docker/**
      - .github/workflows/backend-ci.yml

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"
  COMPOSE_PROJECT_NAME: cch-backend-ci

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install tooling
        run: python -m pip install --upgrade pip && pip install --editable ".[dev]"

      - name: Ruff lint
        run: ruff check src tests

      - name: Ruff format check
        run: ruff format --check src tests

      - name: Mypy
        run: mypy src tests

      - name: Validate environment template keys
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          example = Path(".env.example").read_text(encoding="utf-8")
          keys = {line.split("=", 1)[0] for line in example.splitlines() if line and not line.startswith("#")}
          required_prefix = "CCH_"
          invalid = sorted(k for k in keys if not k.startswith(required_prefix))
          if invalid:
              raise SystemExit(f".env.example contains non-prefixed keys: {invalid}")
          print(f"Validated {len(keys)} CCH_* variables in .env.example")
          PY

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install package
        run: python -m pip install --upgrade pip && pip install --editable ".[dev]"

      - name: Run unit tests
        run: pytest tests/unit -q --cov=cloud_content_hub --cov-branch --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-unit-coverage-${{ github.sha }}
          path: backend/coverage.xml
          if-no-files-found: error

  integration-tests:
    name: Integration and contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Run test stack
        run: docker compose -f docker/docker-compose.test.yml up --build --abort-on-container-exit --exit-code-from test

      - name: Collect reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports-${{ github.sha }}
          path: backend/test-results/
          if-no-files-found: warn

      - name: Tear down test stack
        if: always()
        run: docker compose -f docker/docker-compose.test.yml down -v --remove-orphans

  docker-build:
    name: Docker build smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: runtime
          push: false
          load: true
          tags: cloud-content-hub-api:ci
          build-args: |
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}

      - name: Build worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.worker
          target: runtime
          push: false
          load: true
          tags: cloud-content-hub-worker:ci
          build-args: |
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}

      - name: Verify API health endpoint wiring
        run: |
          docker run --rm -d --name cch-api-smoke -p 18000:8000 \
            -e CCH_ENVIRONMENT=test \
            -e CCH_DATABASE_URL=postgresql+asyncpg://unused:unused@127.0.0.1/unused \
            -e CCH_REDIS_URL=redis://127.0.0.1:6379/0 \
            cloud-content-hub-api:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18000/health/live >/dev/null; then
              echo "Liveness probe passed"
              docker rm -f cch-api-smoke
              exit 0
            fi
            sleep 1
          done
          docker logs cch-api-smoke || true
          docker rm -f cch-api-smoke
          exit 1
