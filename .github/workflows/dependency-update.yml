name: Backend Dependency Update

on:
  schedule:
    - cron: "0 7 * * 2"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  PYTHON_VERSION: "3.13"

jobs:
  update-dependencies:
    name: Propose dependency refresh
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install tooling
        run: python -m pip install --upgrade pip pip-tools

      - name: Compile refreshed requirements lock
        run: |
          pip-compile pyproject.toml --output-file requirements.lock.txt --strip-extras --generate-hashes --resolver=backtracking || \
          pip-compile pyproject.toml --output-file requirements.lock.txt --strip-extras

      - name: Audit refreshed dependencies
        run: python -m pip install pip-audit && pip-audit -r requirements.lock.txt --strict

      - name: Create pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/backend-dependency-refresh
          title: "chore(backend): refresh dependency lock"
          commit-message: "chore(backend): refresh dependency lock"
          body: |
            Automated backend dependency refresh.

            - Regenerated `backend/requirements.lock.txt`
            - Ran `pip-audit` against the lockfile

            Review release notes and run backend CI before merge.
          add-paths: |
            backend/requirements.lock.txt
