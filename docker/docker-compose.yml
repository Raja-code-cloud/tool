name: cloud-content-hub

x-app-environment: &app-environment
  CCH_ENVIRONMENT: ${CCH_ENVIRONMENT:-local}
  CCH_SERVICE_VERSION: ${CCH_SERVICE_VERSION:-dev}
  CCH_LOG_LEVEL: ${CCH_LOG_LEVEL:-INFO}
  CCH_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-cch}:${POSTGRES_PASSWORD:-cch-local-only}@postgres:5432/${POSTGRES_DB:-cloud_content_hub}
  CCH_REDIS_URL: redis://redis:6379/0
  CCH_HTTP_ALLOWED_ORIGINS: '["http://localhost:3000"]'
  CCH_OPENAPI_ENABLED: ${CCH_OPENAPI_ENABLED:-true}

x-app-service: &app-service
  restart: unless-stopped
  init: true
  environment: *app-environment
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks:
    - backend
  security_opt:
    - no-new-privileges:true

services:
  api:
    <<: *app-service
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: runtime
    image: cloud-content-hub-api:${IMAGE_TAG:-local}
    ports:
      - "${API_PORT:-8000}:8000"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/health/ready", timeout=3)
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5

  worker:
    <<: *app-service
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
      target: runtime
    image: cloud-content-hub-worker:${IMAGE_TAG:-local}
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    stop_grace_period: 60s

  beat:
    <<: *app-service
    image: cloud-content-hub-worker:${IMAGE_TAG:-local}
    profiles: ["scheduler"]
    command:
      - celery
      - --app
      - cloud_content_hub.workers.runtime:celery_app
      - beat
      - --loglevel
      - ${CCH_LOG_LEVEL:-INFO}
      - --schedule
      - /tmp/celerybeat-schedule
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777

  migrate:
    image: cloud-content-hub-api:${IMAGE_TAG:-local}
    profiles: ["tools"]
    working_dir: /app
    environment: *app-environment
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true

  postgres:
    image: postgres:17.2-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cloud_content_hub}
      POSTGRES_USER: ${POSTGRES_USER:-cch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cch-local-only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cch} -d ${POSTGRES_DB:-cloud_content_hub}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  redis:
    image: redis:7.4.2-bookworm
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis-data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
