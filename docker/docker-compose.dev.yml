services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: dev
    command:
      - sh
      - -c
      - exec uvicorn cloud_content_hub.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/src
    environment:
      CCH_LOG_LEVEL: DEBUG
    volumes:
      - ../backend/src:/app/src:ro
    read_only: false

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
      target: dev
    command:
      - celery
      - --app
      - cloud_content_hub.workers.runtime:celery_app
      - worker
      - --loglevel
      - DEBUG
    environment:
      CCH_LOG_LEVEL: DEBUG
    volumes:
      - ../backend/src:/app/src:ro
    read_only: false
