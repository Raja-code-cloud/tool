# Prometheus configuration for Cloud Content Hub AI backend.
# Scrape targets assume /metrics is mounted on the API process (see observability/PROMETHEUS.md).

global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s
  external_labels:
    service: cloud-content-hub
    team: platform

rule_files:
  - /etc/prometheus/recording_rules.yml
  - /etc/prometheus/alerts/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: cch-api
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets: ["host.docker.internal:8000"]
        labels:
          component: api
          environment: local

  - job_name: cch-worker
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets: ["host.docker.internal:9100"]
        labels:
          component: worker
          environment: local

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Production ACA targets — replace FQDNs per environment.
  - job_name: cch-api-aca
    metrics_path: /metrics
    scheme: https
    static_configs:
      - targets: ["ca-cch-api-prod.internal:443"]
        labels:
          component: api
          environment: production
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
