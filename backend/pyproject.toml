[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cloud-content-hub"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "alembic>=1.14",
  "anthropic",
  "asyncpg>=0.30",
  "authlib>=1.4",
  "azure-identity>=1.19",
  "azure-storage-blob>=12.24",
  "celery[redis]>=5.4",
  "fastapi>=0.115",
  "google-genai",
  "httpx>=0.28",
  "openai",
  "httpx>=0.28",
  "opentelemetry-api>=1.30",
  "opentelemetry-exporter-otlp-proto-grpc>=1.30",
  "opentelemetry-sdk>=1.30",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "python-multipart>=0.0.20",
  "prometheus-client>=0.21",
  "psutil>=6.1",
  "PyJWT[crypto]>=2.10",
  "cryptography>=44.0",
  "redis>=5.2",
  "sqlalchemy[asyncio]>=2.0",
  "structlog>=24.4",
  "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28",
  "mypy>=1.14",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "pytest-cov>=6.0",
  "ruff>=0.9",
  "types-psutil>=6.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cloud_content_hub"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["celery", "celery.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["openai", "openai.*", "anthropic", "anthropic.*", "google.genai", "google.genai.*"]
ignore_errors = true

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "integration: requires external infrastructure",
  "contract: validates a public contract",
  "migration: validates database migrations",
  "slow: long-running test",
  "external: calls an external service",
]
